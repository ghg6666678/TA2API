services:
  ta2api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      # 架构由 BuildKit 自动注入的 TARGETARCH 决定（amd64 / arm64），无需手动传参。
      # 交叉构建请用：docker buildx build --platform linux/arm64 -f docker/Dockerfile ..
      # 注意：不要在这里传 args.TARGETARCH=${TA_ARCH:-}——空值会覆盖自动架构，导致 COPY 找不到内核。
    image: ta2api:local
    container_name: ta2api
    restart: unless-stopped
    environment:
      TA_HOST: "0.0.0.0"                      # 局域网访问（TA_HOST 已内置于 2026-11-20 版 server.mjs）
      TA_PORT: "8787"
      TA_API_KEY: "${TA_API_KEY:?请在 .env 设置 Bearer 密钥}"
      TA_ADMIN_TOKEN: "${TA_ADMIN_TOKEN:?请在 .env 设置管理台令牌}"
      # 局域网打开管理台需要同时开这两个开关（远程访问强制带令牌）
      TA_ADMIN_ALLOW_REMOTE: "${TA_ADMIN_ALLOW_REMOTE:-1}"
      # 本机模式：容器内无法区分「宿主的 127.0.0.1」和「局域网另一台机器」（都是网桥网关地址）。
      # 仅当端口只绑宿主回环（TA_BIND_ADDR=127.0.0.1）时才可设 1，此时管理台免令牌。
      TA_ADMIN_LOCAL_ONLY: "${TA_ADMIN_LOCAL_ONLY:-0}"
      # 官方登录页地址（NAS 首次登录用，见 DEPLOY-GUIDE.md 第 2 节；不设则用「粘贴回跳网址」通道）
      TA_LOGIN_PAGE_URL: "${TA_LOGIN_PAGE_URL:-}"
      TA_GATEWAY_KEY_FILE: /run/secrets/gateway_key
      TA_DATA_ROOT: /data
      # 看门狗与自续期（均可由 .env 覆盖）
      TA_WATCHDOG_MS: "${TA_WATCHDOG_MS:-15000}"
      # 默认 6h，同一天只尝试一次（与官方客户端一致）。0 = 关闭自动续期
      TA_RENEW_INTERVAL_MS: "${TA_RENEW_INTERVAL_MS:-21600000}"
      # auto / nas / gui。容器内无桌面版数据目录 → 自动判 nas；本机与桌面版并存时设 gui 避免双客户端竞争
      TA_RENEW_MODE: "${TA_RENEW_MODE:-auto}"
    secrets:
      - gateway_key
    ports:
      # PC 本机用 → TA_BIND_ADDR=127.0.0.1（配 TA_ADMIN_LOCAL_ONLY=1，管理台免令牌且不暴露到局域网）
      # NAS 给别人用 → TA_BIND_ADDR=0.0.0.0（管理台需令牌，见 TA_ADMIN_ALLOW_REMOTE）
      - "${TA_BIND_ADDR:-0.0.0.0}:8787:8787"
    volumes:
      # 账号配置布局（current-owner.json / .version.json / users/<ownerDir>/…）——不含密钥
      - ./data/TeleAgent:/data/TeleAgent
      # 运行状态持久化：凭据库(credentials/)、API 密钥(config/api-keys.json)、内核数据与日志
      - ./data/runtime:/app/runtime

secrets:
  gateway_key:
    file: ./gateway_key.txt
