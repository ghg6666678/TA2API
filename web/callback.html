<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TA2API · 登录回调</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f1115;
        --card: #171a21;
        --text: #e8eaed;
        --muted: #9aa0a6;
        --ok: #34a853;
        --err: #ea4335;
        --line: #2a2f3a;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f5f6f8;
          --card: #ffffff;
          --text: #1f2328;
          --muted: #5f6670;
          --line: #e3e6ea;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
        padding: 24px;
      }
      .card {
        width: 100%;
        max-width: 520px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 28px;
        text-align: center;
      }
      .icon { font-size: 40px; line-height: 1; margin-bottom: 12px; }
      h1 { font-size: 18px; margin: 0 0 8px; }
      p { margin: 8px 0; color: var(--muted); }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        font-size: 12px;
        word-break: break-all;
      }
      .kv {
        margin: 16px 0 0;
        padding: 12px 14px;
        background: rgba(127, 127, 127, 0.08);
        border-radius: 8px;
        text-align: left;
        font-size: 12px;
        color: var(--muted);
      }
      .kv b { color: var(--text); font-weight: 600; }
      .actions { margin-top: 20px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
      a.btn, button {
        display: inline-block;
        padding: 8px 16px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--text);
        text-decoration: none;
        font-size: 13px;
        cursor: pointer;
      }
      a.btn.primary { background: #2f6feb; border-color: #2f6feb; color: #fff; }
      .spin {
        width: 28px; height: 28px; margin: 0 auto 16px;
        border: 3px solid var(--line);
        border-top-color: #2f6feb;
        border-radius: 50%;
        animation: r 0.8s linear infinite;
      }
      @keyframes r { to { transform: rotate(360deg); } }
      .hide { display: none !important; }
    </style>
  </head>
  <body>
    <div class="card">
      <div id="busy">
        <div class="spin"></div>
        <h1>正在完成登录…</h1>
        <p>已收到登录回跳，正在把凭据写入反代。</p>
      </div>

      <div id="done" class="hide">
        <div class="icon">✓</div>
        <h1>登录成功</h1>
        <p>凭据已写入，内核正在重新拉起。这个窗口稍后会自动关闭。</p>
        <div class="kv" id="doneInfo"></div>
        <div class="actions">
          <a class="btn primary" id="backLink" href="/admin">返回管理台</a>
        </div>
      </div>

      <div id="fail" class="hide">
        <div class="icon">!</div>
        <h1 id="failTitle">没有收到登录凭据</h1>
        <p id="failMsg"></p>
        <div class="kv mono" id="failUrl"></div>
        <div class="actions">
          <a class="btn primary" id="manualLink" href="/admin">去管理台手动粘贴网址</a>
          <button id="retryBtn" type="button">重试</button>
        </div>
      </div>
    </div>

    <script>
      (function () {
        var adminToken = new URLSearchParams(location.search).get('token') || '';
        var $ = function (id) { return document.getElementById(id); };

        function show(which) {
          ['busy', 'done', 'fail'].forEach(function (id) {
            $(id).classList.toggle('hide', id !== which);
          });
        }

        function fail(title, msg) {
          show('fail');
          $('failTitle').textContent = title;
          $('failMsg').textContent = msg || '';
          $('failUrl').textContent = location.href;
        }

        function baseAdminUrl() {
          return adminToken ? '/admin?token=' + encodeURIComponent(adminToken) : '/admin';
        }

        function submit() {
          var body = { url: location.href };
          var headers = { 'content-type': 'application/json' };
          if (adminToken) headers['x-admin-token'] = adminToken;
          fetch('/admin/api/auth/login', {
            method: 'POST',
            headers: headers,
            body: JSON.stringify(body),
          })
            .then(function (r) { return r.json(); })
            .then(function (d) {
              if (!d || d.ok !== true) {
                fail(
                  '没有收到登录凭据',
                  (d && d.error) || '回跳网址里没有可用的 token。'
                );
                return;
              }
              show('done');
              var rows = ['凭据代次：' + (d.generation != null ? d.generation : '-')];
              if (d.tokenExpiresAt) {
                rows.push('access token 到期：' + new Date(d.tokenExpiresAt).toLocaleString());
              }
              if (d.cookieHint) rows.push('注意：' + d.cookieHint);
              $('doneInfo').textContent = rows.join('\n');
              $('backLink').href = baseAdminUrl();
              $('manualLink').href = baseAdminUrl();
              try {
                if (window.opener && !window.opener.closed) {
                  window.opener.postMessage({ type: 'ta-login-done' }, '*');
                }
              } catch (e) {}
              setTimeout(function () {
                try {
                  if (window.opener && !window.opener.closed) window.close();
                } catch (e) {}
              }, 2500);
            })
            .catch(function (err) {
              fail('写入失败', String((err && err.message) || err));
            });
        }

        $('backLink').href = baseAdminUrl();
        $('manualLink').href = baseAdminUrl();
        $('retryBtn').addEventListener('click', function () { show('busy'); submit(); });
        submit();
      })();
    </script>
  </body>
</html>
